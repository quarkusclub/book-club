<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img" aria-labelledby="title desc">
<title id="title">Stack shallow copy and independent array storage</title>
<desc id="desc">Shallow copies share one array. The correction owns a new array while retaining shared payload references.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333" /></marker></defs>
<rect width="1100" height="200" fill="white" />
<g font-family="monospace" font-size="19" text-anchor="middle" fill="#111">
<text x="260" y="26" font-size="23" fill="#b91c1c">super.clone()</text><text x="820" y="26" font-size="23" fill="#075985">elements.clone()</text>
<g fill="#fff1f2" stroke="#b91c1c" stroke-width="2"><rect x="15" y="50" width="130" height="42" rx="4" /><rect x="15" y="140" width="130" height="42" rx="4" /><rect x="216" y="95" width="130" height="42" rx="4" /><rect x="407" y="95" width="115" height="42" rx="4" /></g>
<text x="80" y="77">original</text><text x="80" y="167">copy</text><text x="281" y="122">elements[]</text><text x="464" y="122">payload</text>
<g fill="#e0f2fe" stroke="#075985" stroke-width="2"><rect x="590" y="50" width="130" height="42" rx="4" /><rect x="590" y="140" width="130" height="42" rx="4" /><rect x="778" y="50" width="130" height="42" rx="4" /><rect x="778" y="140" width="130" height="42" rx="4" /><rect x="970" y="95" width="115" height="42" rx="4" /></g>
<text x="655" y="77">original</text><text x="655" y="167">copy</text><text x="843" y="77">elements[]</text><text x="843" y="167">elements[]</text><text x="1027" y="122">payload</text>
</g>
<g fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"><path d="M145 71 L216 105" /><path d="M145 161 L216 127" /><path d="M346 116 L407 116" /><path d="M720 71 L778 71" /><path d="M720 161 L778 161" /><path d="M908 71 L970 105" /><path d="M908 161 L970 127" /></g>
<path d="M555 40 L555 190" stroke="#ccc" stroke-width="2" />
</svg>
